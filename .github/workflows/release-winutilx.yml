name: Release WinUtilX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout WinUtilX
        uses: actions/checkout@v7

      - name: Compile WinUtilX
        shell: pwsh
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          ./Compile.ps1

      - name: Rename compiled script
        shell: pwsh
        run: Copy-Item ./winutil.ps1 ./winutilx.ps1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ./winutilx.ps1
